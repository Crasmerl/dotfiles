[opener]
edit = [
  { run = "nvim %s", block = true, for = "unix" }
]
open = [
  { run = "xdg-open %s", orphan = true, desc = "Open" }
]
image = [
  { run = "swayimg %s", orphan = true }
]

[open]
prepend_rules = [
  { mime = "image/*", use = "image" },

  { mime = "text/*", use = "edit" },
  { name = "*.md", use = "edit" },
  { name = "*.json", use = "edit" },
  { name = "*.yaml", use = "edit" },
  { name = "*.yml", use = "edit" },
  { name = "*.toml", use = "edit" },
  { name = "*.ini", use = "edit" },
  { name = "*.conf", use = "edit" },
]
append_rules = [
  { name = "*", use = "open" }
]
