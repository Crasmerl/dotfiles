# Generado por Noctalia (user-templates.toml). Lo usa ~/.local/bin/colores-fondo
# Mismos ajustes de color que ~/.tmux.conf, con los colores del fondo
set -g status-style "bg={{colors.surface.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g status-left "#[bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}},bold] 󰇘 #S #[bg={{colors.surface.default.hex}},fg={{colors.primary.default.hex}}]"
setw -g window-status-current-format "#[bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}},bold] #I:#W #[bg={{colors.surface.default.hex}},fg={{colors.primary.default.hex}}]"
setw -g window-status-format "#[bg={{colors.surface.default.hex}},fg={{colors.outline.default.hex}}] #I:#W "
set -g status-right "#[fg={{colors.outline.default.hex}}]#[bg={{colors.outline.default.hex}},fg={{colors.surface.default.hex}},bold] %d/%m %H:%M "
set -g pane-border-style "fg={{colors.outline.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"
set -g message-style "bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}},bold"
set -g message-command-style "bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}},bold"
setw -g clock-mode-colour "{{colors.primary.default.hex}}"
