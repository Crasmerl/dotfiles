# ────────────────────────────────────────────────────────────
#  Hyprlock — minimal blur (1080p refined)
# ────────────────────────────────────────────────────────────
general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = /home/crasmerl/Descargas/lock.jpg
    color = rgba(17, 17, 17, 1.0)

    blur_passes = 2
    blur_size = 5
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.05
}

input-field {
    monitor =
    size = 200, 40
    outline_thickness = 2

    outer_color = rgba(255, 255, 255, 0.20)
    inner_color = rgba(0, 0, 0, 0.25)
    font_color = rgba(255, 255, 255, 0.95)

    rounding = 8
    fade_on_empty = false
    placeholder_text = <span foreground="##dddddd">Contraseña...</span>

    position = 0, -70
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.95)
    font_size = 34
    font_family = JetBrains Mono Nerd Font

    position = 0, 45
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, %d %B %Y')"
    color = rgba(255, 255, 255, 0.75)
    font_size = 14
    font_family = JetBrains Mono Nerd Font

    position = 0, 0
    halign = center
    valign = center
}
