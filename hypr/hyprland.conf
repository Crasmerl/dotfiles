
################
### MONITORS ###
################
# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=eDP-1,1920x1080@60,0x0,1
monitor=HDMI-A-4,1920x1080@60,3840x0,1
monitor=HDMI-A-1,preferred,1920x0,1

input {
    tablet {
        output = HDMI-A-1
    }
}


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = kitty -e yazi
$menu = wofi --show drun --style ~/.config/wofi/estilo-actual.css  # estilo-actual: enlace que cambia colores-fondo
$browser = firefox

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = mpvpaper -o "loop" eDP-1 ~/Videos/wallpaper.mp4  # ahora lo lanza el plugin mpvpaper de Noctalia
exec-once = ~/.config/hypr/scripts/wallpaper-audio.sh  # baja el audio del fondo de vídeo cuando hay ventanas
exec-once = waycorner  # esquina activa arriba-izq: esconder/mostrar ventanas (~/.config/waycorner/config.toml)
# exec-once = waybar & swaync & hypridle  # antes del cambio a Noctalia (2026-10-01)
exec-once = qs -c noctalia-shell
exec-once = hypridle
# hyprswitch init: desactivado, el daemon/GUI se cuelga tras la primera apertura en este sistema (bug reproducido en 5.0.0 y 4.0.1)
exec-once = hyprsunset
# exec-once = eww daemon  # quitado: música ahora en Noctalia (2026-10-03)
#exec-once = hypridle
# exec-once = nm-applet --indicator  # quitado: Wi-Fi en Noctalia (2026-10-03)
# exec-once = blueman-applet  # quitado: Bluetooth en Noctalia (2026-10-03)
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = xwaylandvideobridge
# exec-once = kitty --class cava-bg --override background_opacity=0.0 --override confirm_os_window_close=0 -e cava  # quitado SUPER+C / cava de fondo (2026-10-04)
#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,48
env = XCURSOR_THEME,miku-cursor-linux
env = HYPRCURSOR_SIZE,48
env = HYPRCURSOR_THEME,miku-cursor-hyprcursor
env = XDG_CURRENT_DESKYOP,Hyprland

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 5

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(00FFEAee) rgba(40E0CFee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 5

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled =true
        size = 5
        passes = 2
        new_optimizations = true
        vibrancy = 0.00451
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.08
    bezier = quick,0.15,0,0.1,1
    bezier = bounce,0.22,1.3,0.36,1
    
    
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 5, bounce, slide
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 5, bounce, slide
    animation = workspacesIn, 1, 5, bounce, slide
    animation = workspacesOut, 1, 3, quick, slide
    animation = specialWorkspace, 1, 5, bounce, slidevert  # SUPER+S entra desde abajo
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    #disable_hyprland_dpms = true
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = es
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
  gesture = 3, horizontal, workspace
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Atajos agrupados por categoría para la chuleta de Noctalia (keybind-cheatsheet)
# Formato: # N. CATEGORÍA  y  #"descripción" al final de cada atajo

# 1. APLICACIONES
bind = $mainMod, return, exec, $terminal #"Abrir terminal (Kitty)"
bind = $mainMod, E, exec, $fileManager #"Abrir gestor de archivos"
bind = $mainMod, space, exec, $menu #"Lanzador de apps (wofi)"
bind = $mainMod SHIFT, E, exec, bemoji #"Selector de emojis"
bind = $mainMod, I, exec, kitty --class claude-code -e claude #"Abrir Claude Code"
bind = $mainMod, B, exec, $browser #"Abrir navegador"

# 2. VENTANAS
bind = $mainMod, Q, killactive, #"Cerrar ventana"
bind = $mainMod, V, togglefloating, #"Ventana flotante / mosaico"
bind = $mainMod, P, pseudo, #"Modo pseudo (tamaño propio en mosaico)"
bind = $mainMod, J, layoutmsg, togglesplit #"Cambiar división horizontal / vertical"
bind = $mainMod, left, movefocus, l #"Ir a la ventana de la izquierda"
bind = $mainMod, right, movefocus, r #"Ir a la ventana de la derecha"
bind = $mainMod, up, movefocus, u #"Ir a la ventana de arriba"
bind = $mainMod, down, movefocus, d #"Ir a la ventana de abajo"
bind = $mainMod, F, exec, ~/.local/bin/ventanas-flotantes #"Todas flotantes / volver al mosaico"
bind = SUPER SHIFT, left, swapwindow, l #"Intercambiar con la de la izquierda"
bind = SUPER SHIFT, right, swapwindow, r #"Intercambiar con la de la derecha"
bind = SUPER SHIFT, up, swapwindow, u #"Intercambiar con la de arriba"
bind = SUPER SHIFT, down, swapwindow, d #"Intercambiar con la de abajo"
bind = SUPER, minus, resizeactive, -100 0 #"Estrechar ventana"
bind = SUPER, plus, resizeactive, 100 0 #"Ensanchar ventana"
bind = SUPER SHIFT, minus, resizeactive, 0 -100 #"Encoger ventana (alto)"
bind = SUPER SHIFT, plus, resizeactive, 0 100 #"Estirar ventana (alto)"
binde = SUPER, Tab, cyclenext #"Siguiente ventana"
binde = SUPER SHIFT, Tab, cyclenext, prev #"Ventana anterior"

# 3. SISTEMA
bind = $mainMod, M, exit, #"Salir de Hyprland"
bind = $mainMod, L, exec, qs -c noctalia-shell ipc call lockScreen lock #"Bloquear pantalla"

# 4. CAPTURAS
bind = , PRINT, exec, hyprshot -m output #"Captura de pantalla completa"
bind = shift, PRINT, exec, hyprshot -m region #"Captura de una zona"

# 5. ESCRITORIOS
bind = $mainMod, 1, workspace, 1 #"Ir al escritorio 1"
bind = $mainMod, 2, workspace, 2 #"Ir al escritorio 2"
bind = $mainMod, 3, workspace, 3 #"Ir al escritorio 3"
bind = $mainMod, 4, workspace, 4 #"Ir al escritorio 4"
bind = $mainMod, 5, workspace, 5 #"Ir al escritorio 5"
bind = $mainMod, 6, workspace, 6 #"Ir al escritorio 6"
bind = $mainMod, 7, workspace, 7 #"Ir al escritorio 7"
bind = $mainMod, 8, workspace, 8 #"Ir al escritorio 8"
bind = $mainMod, 9, workspace, 9 #"Ir al escritorio 9"
bind = $mainMod, 0, workspace, 10 #"Ir al escritorio 10"
bind = $mainMod SHIFT, 1, movetoworkspace, 1 #"Mover ventana al escritorio 1"
bind = $mainMod SHIFT, 2, movetoworkspace, 2 #"Mover ventana al escritorio 2"
bind = $mainMod SHIFT, 3, movetoworkspace, 3 #"Mover ventana al escritorio 3"
bind = $mainMod SHIFT, 4, movetoworkspace, 4 #"Mover ventana al escritorio 4"
bind = $mainMod SHIFT, 5, movetoworkspace, 5 #"Mover ventana al escritorio 5"
bind = $mainMod SHIFT, 6, movetoworkspace, 6 #"Mover ventana al escritorio 6"
bind = $mainMod SHIFT, 7, movetoworkspace, 7 #"Mover ventana al escritorio 7"
bind = $mainMod SHIFT, 8, movetoworkspace, 8 #"Mover ventana al escritorio 8"
bind = $mainMod SHIFT, 9, movetoworkspace, 9 #"Mover ventana al escritorio 9"
bind = $mainMod SHIFT, 0, movetoworkspace, 10 #"Mover ventana al escritorio 10"
bind = $mainMod, S, togglespecialworkspace, magic #"Mostrar / ocultar escritorio especial"
bind = $mainMod SHIFT, S, movetoworkspace, special:magic #"Mandar ventana al escritorio especial"
bind = $mainMod, mouse_down, workspace, e+1 #"Escritorio siguiente"
bind = $mainMod, mouse_up, workspace, e-1 #"Escritorio anterior"

# 6. RATÓN
bindm = $mainMod, mouse:272, movewindow #"Arrastrar para mover ventana"
bindm = $mainMod, mouse:273, resizewindow #"Arrastrar para cambiar tamaño"

# 7. SONIDO Y BRILLO
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ #"Subir volumen"
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- #"Bajar volumen"
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle #"Silenciar sonido"
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle #"Silenciar micrófono"
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+ #"Subir brillo"
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%- #"Bajar brillo"

# 8. MÚSICA
bindl = , XF86AudioNext, exec, playerctl next #"Siguiente canción"
bindl = , XF86AudioPause, exec, playerctl play-pause #"Pausar / reanudar"
bindl = , XF86AudioPlay, exec, playerctl play-pause #"Reproducir / pausar"
bindl = , XF86AudioPrev, exec, playerctl previous #"Canción anterior"

# Quitados (se dejan como referencia)
# bind = $mainMod, R, exec,eww open --toggle music  # quitado con eww (2026-10-03)
# bind = $mainMod, C, exec, hyprctl clients -j | grep -q '"cava-bg"' && hyprctl dispatch closewindow class:cava-bg || kitty --class cava-bg --override background_opacity=0.0 --override confirm_os_window_close=0 -e cava  # quitado SUPER+C / cava de fondo (2026-10-04)

# Ventana de Claude Code (SUPER+I)
windowrule {
    name = Claude-Code
    match:class = claude-code

    size = 1200 800
    center = true
}

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0
#layerrule {
 # name = gtk-layer-shell
  #blur = true
  #ignore_alpha = 0.00
#}

# layerrule = blur on, ignore_alpha 0.1, match:namespace ^(eww-music)$
layerrule = blur on, ignore_alpha 0.1, match:namespace ^(wofi)$
layerrule = animation slide right, match:namespace ^(swaync-control-center)$

windowrule {
    name = xwayland-video-bridge-fixes
    match:class = xwaylandvideobridge

    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}


windowrule {
    
    name = ChatGPT
    match:class = chrome-dmnhimeelpmaahoojjaopiiljgmhogde-Default
    

    opacity = 0.88 0.80
}

windowrule {
    name = Whats-AppWeb
    match:class = chrome-hnpfjngllnobngcgfapefoaidbinmjnm-Default

    opacity = 0.88 0.80



}

windowrule {
  name = Yazi-nvim
  match:class = kitty

  opacity = 0.88 0.80
}

windowrule {
    name = youtube-music-mini-player
    match:title = YouTube Music - Mini Player

    float = true
}

