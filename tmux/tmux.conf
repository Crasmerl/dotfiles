# ~/.tmux.conf
# Tema a juego con Kitty (Rosé Pine turquesa)
# Objetivo: que se note claramente en qué ventana/panel estás

# --- Numeración más intuitiva (empieza en 1, no en 0) ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Colores base ---
set -g status-position bottom
set -g status-style "bg=#0C1A19,fg=#E6FFFC"

# --- Ratón: click para cambiar de panel/ventana directamente ---
set -g mouse on

# --- Sesión (izquierda de la barra) ---
set -g status-left-length 30
set -g status-left "#[bg=#40E0CF,fg=#0C1A19,bold] 󰇘 #S #[bg=#0C1A19,fg=#40E0CF]"

# --- Lista de ventanas (el problema que tenías) ---
# Ventana activa: fondo turquesa, texto oscuro y en negrita -> imposible perderse
setw -g window-status-current-format "#[bg=#40E0CF,fg=#0C1A19,bold] #I:#W #[bg=#0C1A19,fg=#40E0CF]"
# Ventanas inactivas: discretas, en gris
setw -g window-status-format "#[bg=#0C1A19,fg=#5A7D79] #I:#W "
setw -g window-status-separator ""

# --- Reloj y hora (derecha de la barra) ---
set -g status-right-length 50
set -g status-right "#[fg=#5A7D79]#[bg=#5A7D79,fg=#0C1A19,bold] %d/%m %H:%M "

# --- Bordes de panel: se ve claro cuál está activo ---
set -g pane-border-style "fg=#5A7D79"
set -g pane-active-border-style "fg=#40E0CF"

# --- Barra encima de cada panel con su número y qué corre en él ---
set -g pane-border-status top
set -g pane-border-format " #P: #{pane_current_command} "

# --- Mensajes de comando (Ctrl+b :) y confirmaciones ---
set -g message-style "bg=#40E0CF,fg=#0C1A19,bold"
set -g message-command-style "bg=#40E0CF,fg=#0C1A19,bold"

# --- Reloj grande (Ctrl+b t) ---
setw -g clock-mode-colour "#40E0CF"

# --- Refrescar la barra a menudo para que el reloj vaya fino ---
set -g status-interval 5

# --- Colores según el fondo (lo rellena ~/.local/bin/colores-fondo; vacío = colores de arriba) ---
source-file -q ~/.config/tmux/colores-fondo.conf
